services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: onboarding
      POSTGRES_PASSWORD: onboarding
      POSTGRES_DB: onboarding
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      # 5433 on the host so a locally installed postgres on 5432 is left alone
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onboarding -d onboarding"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://onboarding:onboarding@db:5432/onboarding
      TARGET_API_BASE_URL: http://api:8000/target/v1
      LOG_FORMAT: json
    volumes:
      - ./sample_customer:/app/sample_customer:ro
      - generated:/app/generated
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 3s
      retries: 10

  ui:
    build: .
    env_file: .env
    environment:
      API_BASE_URL: http://api:8000
    command: ["streamlit", "run", "ui/streamlit_app.py"]
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  generated:
