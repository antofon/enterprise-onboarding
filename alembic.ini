# alembic, when run by hand: `uv run alembic revision --autogenerate -m "what changed"`.
# the app applies the same migrations itself at startup (app/core/migrations.py), and the
# database url always comes from the app's settings (DATABASE_URL), never from this file.
[alembic]
script_location = %(here)s/app/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
