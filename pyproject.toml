[project]
name = "enterprise-onboarding"
version = "0.1.0"
description = "Customer implementation system for mapping, validating, and migrating enterprise data into a SaaS platform: source profiling, AI-assisted schema mapping with human review, deterministic transforms and validation, dry-run migration, reconciliation, and readiness reporting."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pandas>=2.2",
    "httpx>=0.27",
    "typer>=0.12",
    "structlog>=24.4",
    "streamlit>=1.38",
    "anthropic>=0.40",
    "openai>=1.40",
    "faker>=28",
    "python-dateutil>=2.9",
    "pyyaml>=6",
    "alembic>=1.14",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
enterprise-onboarding = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: talks to the postgres from docker compose (port 5433 on the host)",
    "e2e: runs a whole onboarding flow end to end",
]
addopts = "-q"
filterwarnings = [
    # the migration layer sets a per-request timeout, which is right against a real target and
    # which starlette's in-process TestClient warns about. the warning is about the harness.
    "ignore:You should not use the 'timeout' argument with the TestClient",
]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
# the sdks ship types; streamlit pages, yaml and dateutil are the untyped edges
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# the system prompt is prose; wrapping it would change what the model reads
"app/ai/prompts.py" = ["E501"]
"app/ai/report_prompt.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "common", "views"]
